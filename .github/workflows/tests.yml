# Runs the tests of odd2rng.py on every push and pull request, and every
# Monday (the TEI Stylesheets and saxonche change upstream), with a clone
# of the TEI Stylesheets, so that the conversions are tested too.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install saxonche and lxml, and clone the TEI Stylesheets
        run: |
          python -m pip install saxonche lxml
          git clone -q --depth 1 https://github.com/TEIC/Stylesheets.git "$RUNNER_TEMP/Stylesheets"

      - name: Test
        env:
          ODD2RNG_TEST_STYLESHEETS: ${{ runner.temp }}/Stylesheets
        run: python -m unittest discover -s tests -v
